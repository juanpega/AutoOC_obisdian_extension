name: CI

on:
  push:
    branches: ['verify/terminal-picker-20261126-c1']


jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Protected workflow compatibility
        run: node --test tests/workflow-compatibility.test.cjs

      - name: Focused Windows terminal diagnostics
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="native isolated PowerShell stage probe|native shared runner pipe|native shared observer pipe|native observer confirmation" tests/interactive-cli-external.test.cjs

      - name: Run tests
        run: npm test

      - name: Verify native macOS PTY
        if: runner.os == 'macOS'
        env:
          AUTOOC_TEST_NATIVE_PTY: '1'
        run: node --test tests/terminal-pty-macos-native.test.cjs

      - name: Verify release packaging
        run: npm run pack:release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-oc-release-${{ matrix.os }}
          path: release/auto-oc-*.zip
          if-no-files-found: error
